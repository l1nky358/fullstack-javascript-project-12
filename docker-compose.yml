version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
      - "5173:5173"
    command: >
      sh -c "
        cd code &&
        make setup &&
        echo '✅ Build successful!'
      "
    environment:
      - CI=true
      - SKIP_TESTS=true